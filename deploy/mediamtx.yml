logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no
hlsVariant: fmp4
hlsSegmentCount: 6
hlsSegmentDuration: 2s
hlsAllowOrigins: ['*']

webrtc: no

authInternalUsers:
  - user: any
    pass: ""
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

paths:
  all_others:
