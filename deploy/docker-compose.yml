services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: nvr-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  backend:
    build: ../backend
    container_name: nvr-backend
    restart: unless-stopped
    environment:
      - HTTP_PORT=8080
      - MEDIAMTX_API=http://mediamtx:9997
      - MEDIAMTX_RTSP=rtsp://mediamtx:8554
      - RECORDINGS_DIR=/data/recordings
      - PREVIEWS_DIR=/data/previews
      - CAMERAS_FILE=/data/config/cameras.json
      - JWT_SECRET=${JWT_SECRET:-change-me-please-use-long-random-string}
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - nvr_recordings:/data/recordings
      - nvr_previews:/data/previews
      - nvr_config:/data/config
    depends_on:
      - mediamtx
    expose:
      - "8080"

  frontend:
    build: ../frontend
    container_name: nvr-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - mediamtx

volumes:
  nvr_recordings:
  nvr_previews:
  nvr_config:
