version: "3.8"

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "9997:9997"   # API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
      - mediamtx_recordings:/recordings
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=127.0.0.1

  backend:
    build: ../backend
    container_name: nvr-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
      - recordings:/data/recordings
      - previews:/data/previews
    environment:
      - MEDIAMTX_API=http://mediamtx:9997
      - RECORDINGS_DIR=/data/recordings
      - PREVIEWS_DIR=/data/previews
      - JWT_SECRET=change-me-in-production
    depends_on:
      - mediamtx

volumes:
  mediamtx_recordings:
  recordings:
  previews:
